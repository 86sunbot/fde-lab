<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel Use-Case Studio V1 end-to-end flow</title>
  <desc id="desc">A security analyst submits a request, the application creates a typed proposal, validates KQL, writes a disabled review artifact, requires approval, previews deployment, and invokes the existing PowerShell script to create a disabled Sentinel rule.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .title { font: 700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a }
      .label { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a }
      .body { font: 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#334155 }
      .small { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569 }
      .box { stroke:#64748b; stroke-width:2; rx:16 }
      .arrow { stroke:#475569; stroke-width:2.5; fill:none; marker-end:url(#arrow) }
    </style>
  </defs>
  <rect width="1400" height="620" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Sentinel Use-Case Studio — V1 end-to-end flow</text>
  <text x="60" y="88" class="small">Safe baseline: generated rules remain disabled until explicit human approval.</text>

  <rect x="60" y="150" width="190" height="130" class="box" fill="#dbeafe"/>
  <text x="155" y="188" text-anchor="middle" class="label">1. Request</text>
  <text x="155" y="220" text-anchor="middle" class="body">Natural-language</text>
  <text x="155" y="243" text-anchor="middle" class="body">detection requirement</text>

  <rect x="310" y="130" width="220" height="170" class="box" fill="#ede9fe"/>
  <text x="420" y="168" text-anchor="middle" class="label">2. Proposal</text>
  <text x="420" y="200" text-anchor="middle" class="body">OpenAI adapter</text>
  <text x="420" y="223" text-anchor="middle" class="body">or offline fixture</text>
  <text x="420" y="260" text-anchor="middle" class="small">Typed DetectionRuleProposal</text>

  <rect x="590" y="110" width="230" height="210" class="box" fill="#dcfce7"/>
  <text x="705" y="148" text-anchor="middle" class="label">3. Validate</text>
  <text x="705" y="182" text-anchor="middle" class="body">Pydantic schema</text>
  <text x="705" y="205" text-anchor="middle" class="body">Structural checks</text>
  <text x="705" y="228" text-anchor="middle" class="body">KQL detection checks</text>
  <text x="705" y="270" text-anchor="middle" class="small">Fail closed on errors</text>

  <rect x="880" y="130" width="220" height="170" class="box" fill="#fef3c7"/>
  <text x="990" y="168" text-anchor="middle" class="label">4. Review</text>
  <text x="990" y="200" text-anchor="middle" class="body">JSON artifact</text>
  <text x="990" y="223" text-anchor="middle" class="body">KQL + assumptions</text>
  <text x="990" y="260" text-anchor="middle" class="small">enabled = false</text>

  <rect x="1160" y="130" width="180" height="170" class="box" fill="#fee2e2"/>
  <text x="1250" y="168" text-anchor="middle" class="label">5. Approval</text>
  <text x="1250" y="202" text-anchor="middle" class="body">Exact</text>
  <text x="1250" y="225" text-anchor="middle" class="body">APPROVE / REJECT</text>
  <text x="1250" y="262" text-anchor="middle" class="small">Human gate</text>

  <path d="M250 215 H300" class="arrow"/><path d="M530 215 H580" class="arrow"/><path d="M820 215 H870" class="arrow"/><path d="M1100 215 H1150" class="arrow"/>
  <path d="M1250 300 V400 H990 V450" class="arrow"/>

  <rect x="820" y="450" width="340" height="110" class="box" fill="#e0f2fe"/>
  <text x="990" y="487" text-anchor="middle" class="label">6. Deployment gateway</text>
  <text x="990" y="516" text-anchor="middle" class="body">Preview first, then approved apply</text>
  <text x="990" y="540" text-anchor="middle" class="small">CSV/KQL contract to PowerShell</text>

  <rect x="430" y="450" width="290" height="110" class="box" fill="#e2e8f0"/>
  <text x="575" y="487" text-anchor="middle" class="label">7. Sentinel</text>
  <text x="575" y="516" text-anchor="middle" class="body">Disabled scheduled rule</text>
  <text x="575" y="540" text-anchor="middle" class="small">Existing deployment script</text>
  <path d="M820 505 H730" class="arrow"/>
</svg>
