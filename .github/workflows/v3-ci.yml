name: Version 3 CI

on:
  pull_request:
    paths:
      - "document-assistant/versions/v3-enterprise-assistant/**"
      - ".github/workflows/v3-ci.yml"
  push:
    branches: [main]
    paths:
      - "document-assistant/versions/v3-enterprise-assistant/**"
      - ".github/workflows/v3-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-assistant/versions/v3-enterprise-assistant

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: document-assistant/versions/v3-enterprise-assistant/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build deployment image
        run: docker build --tag document-assistant-v3:${{ github.sha }} .
