name: FDE Lab CI (Document Assistant v3 & Sentinel Use-Case Deployment v1)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "portfolio/**"]

permissions:
  contents: read

jobs:
  verify-document-assistant-v3:
    name: Document Assistant v3 (Lint, Pytest & Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-assistant/versions/v3-enterprise-assistant

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: document-assistant/versions/v3-enterprise-assistant/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test (32 tests)
        run: pytest -q

      - name: Build deployment image
        run: docker build --tag document-assistant-v3:${{ github.sha }} .

  verify-sentinel-usecase-v1:
    name: Sentinel Use-Case Deployment v1 Baseline (Lint & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-usecase-deployment

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sentinel-usecase-deployment/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run Sentinel Use-Case V1 Tests (28 tests)
        run: PYTHONPATH=src pytest -q tests
